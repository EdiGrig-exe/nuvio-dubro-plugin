# Build, testare, scanare de secrete și publicare pe GitHub Pages la fiecare push pe main.
# URL public: https://edigrig-exe.github.io/nuvio-dubro-plugin/manifest.json
#
# Acțiunile sunt fixate pe commit SHA (versiunea e în comentariu).
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalare dependențe
        run: npm ci

      - name: Teste (filtre + flux simulat + scanare)
        run: npm test

      - name: Build
        run: npm run build

      - name: Scanare secrete în fișierele generate
        run: node tools/scan-secrets.js dist

      - name: Upload artefact Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}manifest.json
    steps:
      - name: Deploy pe GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
