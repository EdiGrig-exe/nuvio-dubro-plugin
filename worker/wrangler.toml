# Cloudflare Worker pentru sursa FileList a RoDub. Deploy: `npm run worker:deploy` (vezi README).
# Secretele NU stau aici: `npx wrangler secret put ACCESS_TOKEN|FILELIST_USERNAME|FILELIST_PASSKEY`.
name = "rodub-filelist"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Cache pentru hash-uri (permanent) și căutări (6 ore). Worker-ul merge și fără el.
# Creat cu `npx wrangler kv namespace create CACHE`. Id-ul nu e secret: fără autentificare
# în contul Cloudflare nu dă acces la nimic.
[[kv_namespaces]]
binding = "CACHE"
id = "f1fa451d7be1465f8af958dc9d0173d4" # scan-secrets: allow (id KV public, nu e cheie)
